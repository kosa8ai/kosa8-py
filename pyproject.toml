[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosa8"
version = "0.1.0"
description = "Python client for the kosa8 native API: microVM sandboxes for AI agents, with checkpoint, rewind, fork and explore."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["kosa8", "sandbox", "microvm", "ai-agents", "security"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://kosa8.com"
Documentation = "https://docs.kosa8.com"
Source = "https://github.com/kosa8ai/kosa8-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kosa8 = ["py.typed"]
